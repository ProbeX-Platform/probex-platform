name: CI

on:
  pull_request:
    # `edited` re-runs the PR title check after a rename
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Any branch may target staging; main accepts only staging
      - name: Only staging merges into main
        if: ${{ github.base_ref == 'main' && github.head_ref != 'staging' }}
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          echo "::error::PRs into main must come from staging, not '$HEAD'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so every commit of the PR can be checked
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Branch, PR title and commits
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-names.sh "$BRANCH" "$TITLE" "$RANGE"

      - name: Linter
        run: pnpm lint

      - name: Formatter
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests and coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
