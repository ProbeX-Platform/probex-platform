name: CI

on:
  pull_request:
    # `edited` re-runs the PR title check after a rename
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so every commit of the PR can be checked
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Branch, PR title and commits
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          types='[a-z]+'
          subject="^($types)(\([a-z0-9-]+\))?!?: [^ ]"
          ok=true
          if [[ $BRANCH != staging ]] && { [[ ! $BRANCH =~ ^($types)/[a-z0-9]+(-[a-z0-9]+)*$ ]] || ((${#BRANCH} > 50)); }; then
            echo "::error::branch '$BRANCH' must be <type>/<kebab-case>, ≤ 50 chars"; ok=false
          fi
          # Merge commits keep every commit in history, so each subject must follow the same rule as the title
          while IFS= read -r line; do
            if [[ ! $line =~ $subject ]] || ((${#line} > 100)); then
              echo "::error::'$line' must be a Conventional Commit, ≤ 100 chars"; ok=false
            fi
          done < <(printf '%s\n' "$TITLE"; git log --no-merges --format=%s "$RANGE")
          $ok

      - name: Linter
        run: pnpm lint

      - name: Formatter
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests and coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
